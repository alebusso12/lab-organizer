<title>Lab Organizer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/smiles-drawer@1.2.0/dist/smiles-drawer.min.js"></script>
<style>
/* Layout: sidebar (Today, Projects, Search + project list) + work area; projects are the centre, everything lives inside one */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --sunk:#e8eeec; --ink:#14201e; --muted:#5a6a67; --line:#d6dfdc;
  --accent:#1d5bd6; --accent-ink:#ffffff; --ok:#1d8656; --warn:#a86a12; --bad:#c03b27;
  --f-display:"Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1413; --surface:#161e1d; --sunk:#1c2625; --ink:#e4edeb; --muted:#93a39f; --line:#2a3634;
  --accent:#6f9dff; --accent-ink:#0b1220; --ok:#4cc58d; --warn:#e3ad52; --bad:#ff7d66; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1413; --surface:#161e1d; --sunk:#1c2625; --ink:#e4edeb; --muted:#93a39f; --line:#2a3634;
  --accent:#6f9dff; --accent-ink:#0b1220; --ok:#4cc58d; --warn:#e3ad52; --bad:#ff7d66; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.85em;letter-spacing:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,3vw,2.3rem)}
h2{font-size:1.25rem}
h3{font-size:.78rem;font-family:var(--f-body);font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--ink);color:var(--bg)}
.nav .n{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.nav a.on .n{color:inherit;opacity:.7}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.side .projs a{font-weight:400;font-size:.93rem;flex-wrap:wrap;row-gap:4px}
.side .projs a .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.side .projs a .bar{flex-basis:100%;height:3px;margin-left:19px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}

.main{padding-block:28px 60px;padding-left:max(16px,2.5vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.5vw);min-width:0;max-width:1240px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:22px}
.head .sub{color:var(--muted);margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:.92rem}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:10px 18px;font-size:1rem;font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:5px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.84rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.grid-today{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:22px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h .cnt{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.sec-h.bad h3{color:var(--bad)}

/* quick add */
.qa{display:flex;flex-wrap:wrap;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.qa input[type=text],.qa textarea{flex:1 1 220px;min-width:0;border:0;background:transparent;padding:6px 8px;outline:none}
.qa textarea{resize:vertical;min-height:38px}
.qa select,.qa input[type=date],.qa input[type=number]{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 8px;max-width:100%}
.qa input[type=number]{width:84px}

/* tasks */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list>li+li{border-top:1px solid var(--line)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 12px}
.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;margin-top:1px;padding:0}
.check svg{opacity:0}
.check:hover{border-color:var(--ok)}
.task.done .check{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.task.done .check svg{opacity:1}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task.p1 .check{border-color:var(--bad)}
.ttl{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:3px;font-size:.82rem;color:var(--muted);align-items:center}
.meta a{text-decoration:none}
.hrs{font-family:var(--f-mono);font-size:.76rem;padding:0 6px;border-radius:5px;background:var(--sunk);color:var(--ink);border:0;line-height:1.6}
button.hrs{cursor:pointer}
button.hrs:hover{outline:1px solid var(--muted)}
.hrs.guess{color:var(--muted)}

/* settings */
.kinds{display:flex;flex-direction:column;gap:8px}
.krow{display:grid;grid-template-columns:auto minmax(140px,1.1fr) 92px minmax(160px,2fr) auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.krow.hd{background:transparent;border:0;padding-block:0;font-size:.76rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.krow input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
.krow .ord{display:flex;flex-direction:column}
.krow .ord button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 4px;line-height:1.1;font-size:.8rem}
.krow .ord button:disabled{opacity:.25;cursor:default}
.krow .use{font-size:.74rem;color:var(--muted);white-space:nowrap}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,220px));gap:12px}
.setgrid .fld input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 14px;z-index:5}
.savebar .btn{border-color:transparent}
@media (max-width:760px){.krow{grid-template-columns:auto minmax(0,1fr) 80px auto}.krow .kw{grid-column:2/-1}.krow.hd{display:none}}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--muted)) 14%,transparent);color:var(--ink);text-decoration:none;white-space:nowrap}
.chip .dot{width:7px;height:7px}
.due.late{color:var(--bad);font-weight:600}
.due.today{color:var(--accent);font-weight:600}
.tact{display:flex;gap:2px}
.star{color:var(--muted)}
.star.on{color:var(--warn)}
.empty{padding:16px;color:var(--muted);font-size:.92rem;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* daily work */
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.daybar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.daybar i{display:block;height:100%;background:var(--c,var(--accent))}
.daybar i.done{opacity:.35}
.dayleg{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-family:var(--f-mono)}
.slot{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);white-space:nowrap}

/* pills */
.pill{font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid currentColor;cursor:pointer;background:transparent;white-space:nowrap;line-height:1.5}
.pill.s-ok{color:var(--ok)} .pill.s-warn{color:var(--warn)} .pill.s-bad{color:var(--bad)} .pill.s-acc{color:var(--accent)} .pill.s-mut{color:var(--muted)}
.health{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;white-space:nowrap}
.health::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.health.ok{color:var(--ok)} .health.warn{color:var(--warn)} .health.bad{color:var(--bad)} .health.mut{color:var(--muted)}

/* progress bars */
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:.8rem}
.bars .lb{color:var(--muted)}
.bars .vl{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);text-align:right;white-space:nowrap}
.bars .bar{height:7px}
.bars .bar.b2 i{background:color-mix(in srgb,var(--c,var(--accent)) 70%,var(--ok))}
.bars .bar.b3 i{background:color-mix(in srgb,var(--c,var(--accent)) 45%,var(--muted))}
.overall{display:flex;align-items:baseline;gap:8px}
.overall b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1}
.overall span{font-size:.78rem;color:var(--muted)}

/* projects */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--ink);position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c)}
.pcard:hover{border-color:var(--muted)}
.pcard .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pcard h2{font-size:1.15rem}
.pcard .goal{color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.next{font-size:.85rem;border-top:1px solid var(--line);padding-top:8px}
.next span{color:var(--muted)}

/* project page */
.phead{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.phead .code{font-family:var(--f-mono);font-size:.82rem;color:var(--c);font-weight:500}
.pcheck{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 28px;align-items:center}
.pfacts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem;color:var(--muted);grid-column:1/-1}
.pfacts b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--c,var(--accent))}
.tabs .n{font-family:var(--f-mono);font-size:.72rem;margin-left:4px}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .x{color:var(--muted);font-size:.86rem;overflow-wrap:anywhere;white-space:pre-wrap}
.item .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto;justify-content:space-between}
.idea .t{font-weight:400;white-space:pre-wrap}
.sel{user-select:all;font-family:var(--f-mono);font-size:.8rem;overflow-wrap:anywhere}

/* compounds */
.struct{background:#ffffff;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.struct canvas,.struct img{max-width:100%;max-height:100%;display:block}
.struct .ph{color:#7a8886;font-size:.82rem;text-align:center;padding:12px}
.cmp{cursor:pointer;text-align:left}
.cmp:hover{border-color:var(--muted)}
.cmp .code{font-family:var(--f-mono);font-weight:500;color:var(--c,var(--accent))}
.techs{display:flex;flex-wrap:wrap;gap:4px}
.tech{font-size:.72rem;padding:1px 7px;border-radius:6px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ink);white-space:nowrap}
.tech.miss{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.cdetail{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;align-items:start}
.names{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.name{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:7px;padding:3px 4px 3px 10px;font-size:.92rem;overflow-wrap:anywhere}
.name button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px;font-size:1rem;line-height:1}
.name button:hover{color:var(--bad)}
.inl{display:flex;gap:6px;flex-wrap:wrap}
.inl input,.inl select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 9px;min-width:0;flex:1 1 160px}
.props{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.9rem;margin:0}
.props dt{color:var(--muted)}
.props dd{margin:0;overflow-wrap:anywhere}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.entry .eh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.entry .tn{font-weight:600}
.entry input[type=text],.entry textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;width:100%}
.entry textarea{font-family:var(--f-mono);font-size:.82rem;min-height:70px;resize:vertical}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file{display:flex;flex-direction:column;gap:4px;width:128px;font-size:.76rem}
.file a.th{display:grid;place-items:center;height:92px;border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden;text-decoration:none;color:#5a6a67;font-family:var(--f-mono);font-weight:500}
.file a.th img{max-width:100%;max-height:100%}
.file .fn{display:flex;gap:2px;align-items:center;justify-content:space-between;color:var(--muted)}
.file .fn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fn button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 3px}
.file .fn button:hover{color:var(--bad)}
.up{position:relative;overflow:hidden}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* search */
.sform{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:start}
.sform .fields{display:flex;flex-direction:column;gap:12px;min-width:0}
.sform label{font-size:.8rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.sform input[type=text],.sform select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.sform .opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end}
.sform .opts>div{flex:1 1 180px;min-width:0}
.sform .ck{display:flex;gap:8px;align-items:center;font-size:.9rem;flex:0 0 auto}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.timeline .day{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px}
.timeline .d{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:3px}
.timeline .evs{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--line);padding-left:14px}
.ev{font-size:.92rem;overflow-wrap:anywhere}
.ev .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-right:6px}
.ev.note .k{color:var(--accent)} .ev.done .k{color:var(--ok)}
.ev .x{white-space:pre-wrap}

/* heatmap */
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow-x:auto}
.heat i{border-radius:3px;background:var(--sunk)}
.heat i.l1{background:color-mix(in srgb,var(--ok) 35%,var(--sunk))}
.heat i.l2{background:color-mix(in srgb,var(--ok) 65%,var(--sunk))}
.heat i.l3{background:var(--ok)}
.heat i.now{outline:1.5px solid var(--ink);outline-offset:-1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.76rem;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:14px}
.mini a{text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.mini .r{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;align-items:center}
.mini .r .v{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted)}
.banner{padding:10px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:.9rem;margin-bottom:16px}
details.done-box summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:4px 0}

/* modal */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.sheet form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.w{grid-column:1/-1}
.fld label{font-size:.8rem;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.fld textarea{min-height:90px;resize:vertical}
.fld .hint{font-size:.76rem;color:var(--muted)}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.fld.chk input{width:auto}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches label{width:28px;height:28px;border-radius:50%;background:var(--c);cursor:pointer;display:grid;place-items:center}
.swatches input{position:absolute;opacity:0;width:0;height:0}
.swatches input:checked+span{width:10px;height:10px;border-radius:50%;background:var(--surface)}
.swatches input:focus-visible+span{outline:2px solid var(--ink)}
.sheet .acts{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.sheet textarea.si{width:100%;min-height:220px;font-family:var(--f-mono);font-size:.82rem;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:60}

@media (max-width:980px){.grid-today{grid-template-columns:minmax(0,1fr)}.cdetail{grid-template-columns:minmax(0,1fr)}.sform{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px}
  .side .nav.main-nav{flex-direction:row;overflow-x:auto}
  .side .nav.main-nav a{white-space:nowrap}
  .side .projs,.side .lbl-p,.side-foot{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .sheet form{grid-template-columns:1fr}
  .timeline .day{grid-template-columns:1fr;gap:4px}
  .pcheck{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.task,.item,.pcard{transition:border-color .15s}}

<script>
(function(){
const COLORS=['#3b6fe0','#12998a','#d08a1a','#d0457a','#7a5bd6','#6d8b2a','#5b7085','#c0573a'];
/* default activity types: list order = order of the day (reactions first, desk work last).
   hours = default hands-on time; keys = words that detect the type from a task title. All editable in Settings. */
const DEF_KINDS=[
  {name:'Synthesis',hours:3,keys:'synth, reaction, coupling, set up, setup, reflux, prepar, scale-up, scale up, repeat, stir, protect, deprotect, reduc, oxidi, alkylat, cycliz'},
  {name:'Workup / purification',hours:2,keys:'column, flash, chromatog, recrystal, distil, extract, workup, work-up, filtr, purif, evapor, rotavap, sublim'},
  {name:'Characterization',hours:1.5,keys:'nmr, hrms, ms, ir, uv, mass spec, x-ray, xray, hplc, gc-ms, characteri, spectr, melting, elemental, optical rotation, fluoresc, voltammetr'},
  {name:'Meeting',hours:1,keys:'meeting, call, seminar, discuss, supervisor'},
  {name:'Orders & inventory',hours:0.5,keys:'order, buy, purchase, inventory, stock'},
  {name:'Writing',hours:2,keys:'write, draft, report, thesis, manuscript, si, supporting, slides, presentation, poster, abstract'},
  {name:'Reading',hours:1,keys:'read, paper, review, literature, reaxys, scifinder'},
  {name:'Other',hours:1,keys:''}
];
const reCache=new Map();
const keyRes=keys=>{if(!reCache.has(keys))reCache.set(keys,String(keys||'').split(',').map(k=>k.trim().toLowerCase()).filter(Boolean).map(k=>{const e=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return new RegExp('(^|[^\\p{L}\\p{N}])'+e+(k.length<=3?'(?![\\p{L}\\p{N}])':''),'iu')}));return reCache.get(keys)};
/* the type whose keyword appears earliest in the title wins */
function guessKind(title){const ks=cfg().kinds;let best=null,pos=1e9;for(const k of ks)for(const re of keyRes(k.keys)){const m=re.exec(title||'');if(m&&m.index<pos){pos=m.index;best=k.name}}return best||(ks.find(k=>/^other$/i.test(k.name))||ks[ks.length-1]||{name:'Other'}).name}
const TECH=[
  ['¹H NMR','400 MHz, CDCl₃','δ 7.26 (d, J = 8.1 Hz, 2H), …'],
  ['¹³C{¹H} NMR','101 MHz, CDCl₃','δ 170.2, 138.5, …'],
  ['¹⁹F NMR','376 MHz, CDCl₃','δ −62.8 (s, 3F)'],
  ['³¹P NMR','162 MHz, CDCl₃','δ …'],
  ['2D NMR (COSY, HSQC, HMBC, NOESY)','',''],
  ['HRMS','ESI-TOF, m/z','[M+H]⁺ calcd for C₁₀H₁₂NO₂ 178.0863, found 178.0861'],
  ['IR','ATR, neat, cm⁻¹','ν 3320, 1715, 1602'],
  ['UV-Vis','CH₂Cl₂, 10⁻⁵ M','λmax (ε) 312 nm (1.2 × 10⁴ M⁻¹ cm⁻¹)'],
  ['Fluorescence','',''],
  ['Melting point','','m.p. 132–134 °C'],
  ['Optical rotation','c 1.0, CHCl₃, 20 °C','[α]D +35.2'],
  ['HPLC / chiral HPLC','column, eluent, flow','tR 12.3 min (major), 14.1 min (minor); 96:4 er'],
  ['X-ray','','CCDC …'],
  ['Elemental analysis','','Anal. calcd for …: C, …; H, …; N, …. Found: …'],
  ['TLC','eluent','Rf 0.35'],
  ['Yield','','72% (1.23 g), white solid'],
  ['Other','','']
];
const CORE=['¹H NMR','¹³C{¹H} NMR','HRMS'];
const SHORT={'¹H NMR':'¹H','¹³C{¹H} NMR':'¹³C','¹⁹F NMR':'¹⁹F','³¹P NMR':'³¹P','2D NMR (COSY, HSQC, HMBC, NOESY)':'2D','Melting point':'m.p.','Optical rotation':'[α]D','HPLC / chiral HPLC':'HPLC','Elemental analysis':'EA'};

  papers:[['leggere','To read','s-warn'],['letto','Read','s-mut'],['chiave','Key paper','s-acc']],
  people:[['attiva','Active','s-ok'],['contattare','To contact','s-warn'],['attesa','Awaiting reply','s-acc'],['conclusa','Ended','s-mut']]
};
const SCHEMA={

    ['name','Project name','text',{req:1,w:1}],['code','Short code','text',{ph:'e.g. PRJ-01'}],['status','Status','status'],
    ['color','Colour','color',{w:1}],['goal','Goal','textarea',{w:1,ph:'Target molecule, research question, deadline…'}],
    ['deadline','Project deadline','date'],['fmProject','Name on FindMolecule','text'],['fmUrl','FindMolecule project link','url',{w:1}]]},
  tasks:{one:'task',f:[

    ['kind','Activity type','select',{opts:()=>[['','Guess from the title'],...cfg().kinds.map(k=>[k.name,`${k.name} (default ${fh(k.hours)})`])]}],

    ['focus','Must do today','focus'],['elnRef','ELN experiment ref.','text',{ph:'e.g. AB-042'}],['elnUrl','FindMolecule experiment link','url'],

    ['formula','Molecular formula','text',{ph:'C₁₀H₁₁NO₂'}],['mw','MW (g/mol)','text',{ph:'177.20'}],
    ['elnRef','ELN experiment ref.','text',{ph:'e.g. AB-042'}],['elnUrl','FindMolecule experiment link','url'],
    ['notes','Notes','textarea',{w:1,ph:'Appearance, stability, storage…'}]]},
  papers:{one:'paper',f:[
    ['title','Title','text',{req:1,w:1}],['authors','Authors','text',{w:1,ph:'e.g. Smith, J.; Rossi, M.'}],['journal','Journal','text',{ph:'e.g. J. Am. Chem. Soc.'}],['year','Year','text'],
    ['doi','DOI','text',{ph:'10.1021/…'}],['url','Link (if no DOI)','url'],['status','Status','status'],['projectId','Project','project'],
    ['notes','Why it matters','textarea',{w:1,ph:'Reaction conditions, SI procedure, reference spectra…'}]]},
  people:{one:'collaborator',f:[
    ['name','Name','text',{req:1}],['affiliation','Group / institution','text'],['role','Role in the project','text',{w:1,ph:'e.g. Crystallography, DFT, biological assays'}],
    ['email','Email','text'],['status','Status','status'],['lastContact','Last contact','date'],['projectId','Project','project'],
    ['notes','Notes','textarea',{w:1,ph:'Samples sent, agreements, next steps…'}]]},
  fmlinks:{one:'FindMolecule link',f:[
    ['label','Description','text',{req:1,w:1,ph:'e.g. Suzuki coupling, 2 g scale-up'}],['kind','Type','select',{opts:[['eln','ELN experiment'],['inv','Inventory item'],['altro','Other']]}],
    ['ref','Code','text',{ph:'e.g. AB-042 or bottle no.'}],['url','Link','url',{req:1,w:1,ph:'Copy the address from the FindMolecule page'}],['projectId','Project','project']]},
  log:{one:'progress note',f:[['date','Date','date'],['projectId','Project','project'],['text','What happened','textarea',{req:1,w:1}]]}
};
const COLS=Object.keys(SCHEMA);
const ALL=[...COLS,'settings','plans'];
const S={}; ALL.forEach(c=>S[c]=[]);
let db=null, assets=null, phase='loading', slow=false; const loaded=new Set();
const ui={tab:{}, openC:'', s:{q:'',sub:'',pid:'',miss:false}};
try{const st=JSON.parse(localStorage.getItem('lab-ui')||'{}');Object.assign(ui,st);ui.s=Object.assign({q:'',sub:'',pid:'',miss:false},st.s||{})}catch(e){}
const saveUi=()=>{try{localStorage.setItem('lab-ui',JSON.stringify(ui))}catch(e){}};
const LOC='en-GB';

/* ---------- utils ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const fmt=(s,o)=>s?pd(s).toLocaleDateString(LOC,o||{weekday:'short',day:'numeric',month:'short'}):'';
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const LOCAL_BLOBS={};
const PIX='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const blob=(id,type)=>LOCAL_BLOBS[id]||(GHC?(ghBlob(id,type),PIX):'/_blob/'+encodeURIComponent(id));
const uid=()=>Math.random().toString(36).slice(2,10);
const proj=id=>S.projects.find(p=>p.id===id);
const stOf=(col,v)=>(ST[col]||[]).find(s=>s[0]===v)||(ST[col]||[])[0];
const ofP=(col,pid)=>S[col].filter(x=>x.projectId===pid);
const projSorted=()=>{const o={attivo:0,pausa:1,concluso:2};return [...S.projects].sort((a,b)=>(o[a.status]??0)-(o[b.status]??0)||(a.created||0)-(b.created||0))};
const liveProj=t=>{const p=proj(t.projectId);return p&&p.status!=='concluso'&&p.status!=='pausa'};
const taskSort=(a,b)=>(a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:((+a.priority||2)-(+b.priority||2))||((a.created||0)-(b.created||0));
const fh=h=>{h=Math.round(h*4)/4;if(h<=0)return '0 h';const H=Math.floor(h),m=Math.round((h-H)*60);return H&&m?`${H} h ${m}′`:H?`${H} h`:`${m}′`};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function fail(e){console.error(e);toast(e&&e.code==='quota_exceeded'?'Storage is full: delete a few items.':'Could not save. Try again in a moment.')}

/* ---------- settings & time estimates ---------- */
function cfg(){
  const s=S.settings.find(x=>x.id==='main')||{};
  const kinds=Array.isArray(s.kinds)&&s.kinds.length?s.kinds:DEF_KINDS.map(k=>Object.assign({},k,s.hours&&s.hours[k.name]>0?{hours:+s.hours[k.name]}:{}));
  return{day:+s.day>0?+s.day:8,start:s.start||'09:00',kinds};
}
const kindDef=name=>cfg().kinds.find(k=>k.name===name);
const kindOf=t=>t.kind&&kindDef(t.kind)?t.kind:guessKind(t.title);
const kindIdx=name=>{const i=cfg().kinds.findIndex(k=>k.name===name);return i<0?99:i};
const est=t=>{const h=parseFloat(t.hours);return h>0?h:(+(kindDef(kindOf(t))||{}).hours||1)};
const isGuess=t=>!(parseFloat(t.hours)>0);

/* ---------- data ---------- */
async function add(col,data){try{return await db.collection(col).add(Object.assign({created:Date.now()},data))}catch(e){fail(e)}}
async function upd(col,id,data){try{await db.doc(col+'/'+id).update(data)}catch(e){fail(e)}}
async function put(col,id,data){try{await db.doc(col+'/'+id).set(data)}catch(e){fail(e)}}
async function del(col,id){try{await db.doc(col+'/'+id).delete()}catch(e){fail(e)}}
async function dropAsset(id){if(!assets||!id)return;try{await assets.delete(id)}catch(e){console.warn(e)}}

/* ---------- project progress check ---------- */
function progress(pid){
  const p=proj(pid)||{},ts=ofP('tasks',pid),open=ts.filter(t=>!t.done),td=today();
  const hDone=ts.filter(t=>t.done).reduce((s,t)=>s+est(t),0), hAll=ts.reduce((s,t)=>s+est(t),0);
  const cs=ofP('compounds',pid), cFull=cs.filter(c=>!missing(c).length).length;
  const ps=ofP('papers',pid), pRead=ps.filter(x=>x.status!=='leggere').length;
  const overdue=open.filter(t=>t.due&&t.due<td).length;
  const acts=[...ts.filter(t=>t.done&&t.doneAt).map(t=>t.doneAt),...ofP('log',pid).map(l=>l.date)].filter(Boolean).sort();
  const last=acts.length?acts[acts.length-1]:'';
  const since=last?diff(td,last):(p.created?Math.floor((Date.now()-p.created)/864e5):0);
  const pc=(a,b)=>b?Math.round(a/b*100):0;
  const bars=[{k:'Tasks',v:pc(hDone,hAll),t:`${ts.filter(t=>t.done).length}/${ts.length} · ${fh(hAll-hDone)} left`,n:ts.length,cls:''},
    {k:'Characterization',v:pc(cFull,cs.length),t:`${cFull}/${cs.length} complete`,n:cs.length,cls:'b2'},
    {k:'Literature',v:pc(pRead,ps.length),t:`${pRead}/${ps.length} read`,n:ps.length,cls:'b3'}];
  const used=bars.filter(b=>b.n);
  const overall=used.length?Math.round((pc(hDone,hAll)*(ts.length?3:0)+pc(cFull,cs.length)*(cs.length?2:0)+pc(pRead,ps.length)*(ps.length?1:0))/((ts.length?3:0)+(cs.length?2:0)+(ps.length?1:0))):0;
  let health;
  if(p.status==='concluso')health=['mut','Completed'];
  else if(p.status==='pausa')health=['mut','On hold'];
  else if(p.deadline&&p.deadline<td&&open.length)health=['bad','Past deadline'];
  else if(overdue)health=['bad',`${overdue} overdue`];
  else if(since>=14&&(ts.length||p.created))health=['warn',`No activity for ${since} d`];
  else if(p.deadline&&open.length){const daysLeft=diff(p.deadline,td),need=(hAll-hDone)/cfg().day;health=need>daysLeft*0.6?['warn',`Tight: ${fh(hAll-hDone)} left, ${daysLeft} d to deadline`]:['ok','On track']}
  else health=['ok','On track'];
  return{bars,overall,health,last,since,overdue,hLeft:hAll-hDone,open:open.length};
}
const barsHtml=(g,only)=>`<div class="bars">${g.bars.filter(b=>!only||b.n).map(b=>`<span class="lb">${b.k}</span><div class="bar ${b.cls}" role="progressbar" aria-label="${b.k}" aria-valuenow="${b.v}" aria-valuemin="0" aria-valuemax="100"><i style="width:${b.v}%"></i></div><span class="vl">${b.n?b.v+'%':'—'}</span>`).join('')}</div>`;
const healthHtml=g=>`<span class="health ${g.health[0]}">${esc(g.health[1])}</span>`;

/* ---------- pieces ---------- */
const ICON={
  check:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
  star:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  starO:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',

  plus:'<svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>',
  ext:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 3h4v4M13 3L7 9M11 10v3H3V5h3"/></svg>',
  up:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V3M4.5 6.5L8 3l3.5 3.5M3 13h10"/></svg>',
  plan:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3M5 9.5h3M5 11.8h5"/></svg>',
  flask:'<svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 4h8M13.5 4v8.5L6 25.5A2 2 0 0 0 7.8 28.5h16.4a2 2 0 0 0 1.8-3L18.5 12.5V4"/><path d="M9 20h14" stroke="var(--accent)"/><circle cx="14" cy="24" r="1.3" fill="var(--accent)" stroke="none"/><circle cx="19" cy="23" r="1" fill="var(--accent)" stroke="none"/></svg>'
};
const projChip=pid=>{const p=proj(pid);return p?`<a class="chip" style="--c:${p.color||COLORS[0]}" href="#p-${esc(p.id)}"><span class="dot"></span>${esc(p.code||p.name)}</a>`:''};
const pill=(col,item)=>{const s=stOf(col,item.status);return s?`<button class="pill ${s[2]}" data-act="cycle" data-col="${col}" data-id="${esc(item.id)}" title="Change status">${s[1]}</button>`:''};
const editBtn=(col,id)=>`<button class="btn ghost" data-act="edit" data-col="${col}" data-id="${esc(id)}" aria-label="Edit">${ICON.edit}</button>`;

function dueLabel(t){
  if(!t.due) return '';
  const d=diff(t.due,today());
  if(t.done) return `<span class="due">${fmt(t.due)}</span>`;
  if(d<0) return `<span class="due late">${-d} day${d===-1?'':'s'} overdue</span>`;
  if(d===0) return `<span class="due today">due today</span>`;
  if(d===1) return `<span class="due">due tomorrow</span>`;
  return `<span class="due">due ${fmt(t.due)}</span>`;
}
function taskRow(t,o={}){
  const foc=t.focus===today();
  const eln=t.elnRef||t.elnUrl?(safeUrl(t.elnUrl)?`<a href="${esc(t.elnUrl)}" target="_blank" rel="noopener" class="mono">ELN ${esc(t.elnRef||'')} ${ICON.ext}</a>`:`<span class="mono">ELN ${esc(t.elnRef)}</span>`):'';
  const h=est(t), long=h>cfg().day;
  return `<li class="task p${esc(t.priority||2)} ${t.done?'done':''}">
    <button class="check" data-act="toggle" data-id="${esc(t.id)}" aria-label="${t.done?'Mark as not done':'Mark as done'}">${ICON.check}</button>

/* ---------- daily work planner ---------- */
function planScore(t,td){
  let s={1:30,2:15,3:6}[+t.priority||2]||15;
  if(t.focus===td)s+=1000;
  if(t.due){const d=diff(t.due,td);if(d<0)s+=80+Math.min(-d,14)*4;else if(d===0)s+=70;else if(d<=14)s+=45/(d+0.5)}
  if(t.created)s+=Math.min((Date.now()-t.created)/864e5,20)*.4;
  const p=proj(t.projectId);if(p&&p.deadline){const d=diff(p.deadline,td);if(d>=0&&d<=21)s+=12*(1-d/21)}
  return s;
}
function buildPlan(){
  const td=today(),C=cfg(),cap=Math.round(C.day*4);
  const doneToday=S.tasks.filter(t=>t.done&&t.doneAt===td);
  const used=Math.round(doneToday.reduce((s,t)=>s+est(t),0)*4);
  const free=Math.max(0,cap-used);
  const cand=S.tasks.filter(t=>!t.done&&liveProj(t)).map(t=>({t,w:Math.max(1,Math.min(cap,Math.round(est(t)*4))),v:planScore(t,td)}));
  // 0/1 knapsack on quarter-hours: best total priority that fits the free time
  const n=cand.length,best=Array(free+1).fill(0),keep=cand.map(()=>new Uint8Array(free+1));
  for(let i=0;i<n;i++){const {w,v}=cand[i];for(let c=free;c>=w;c--){if(best[c-w]+v>best[c]){best[c]=best[c-w]+v;keep[i][c]=1}}}
  let c=free;const pick=[];for(let i=n-1;i>=0;i--){if(keep[i][c]){pick.push(cand[i].t);c-=cand[i].w}}
  pick.sort((a,b)=>kindIdx(kindOf(a))-kindIdx(kindOf(b))||planScore(b,td)-planScore(a,td));
  return{date:td,ids:[...doneToday.map(t=>t.id),...pick.map(t=>t.id)],day:C.day,made:Date.now()};
}
const todayPlan=()=>S.plans.find(p=>p.id===today());
function clock(start,h){const [H,M]=start.split(':').map(Number);const m=H*60+M+Math.round(h*60);return pad(Math.floor(m/60)%24)+':'+pad(m%60)}

function sideActivity(){

/* ---------- structure search: SMILES parser + substructure match ---------- */
function parseSmiles(s){
  const atoms=[],bonds=[];let prev=-1,bo=null,i=0;const stack=[],ring={};
  const bond=(a,b,o)=>{if(a<0||b<0)return;const ar=atoms[a].ar&&atoms[b].ar;const order=o==='='?2:o==='#'?3:o==='$'?4:o===':'?1.5:o==='-'?1:(ar?1.5:1);bonds.push([a,b,order])};
  s=String(s||'').trim();
  while(i<s.length){
    const ch=s[i];
    if(ch==='('){stack.push(prev);i++;continue}
    if(ch===')'){prev=stack.length?stack.pop():-1;i++;continue}
    if(ch==='.'){prev=-1;i++;continue}
    if('-=#$:'.includes(ch)){bo=ch;i++;continue}
    if(ch==='/'||ch==='\\'){i++;continue}
    if(/[0-9%]/.test(ch)){let n;if(ch==='%'){n=s.substr(i+1,2);i+=3}else{n=ch;i++}
      if(ring[n]){bond(ring[n].a,prev,bo||ring[n].bo);delete ring[n]}else ring[n]={a:prev,bo};bo=null;continue}
    let el;
    if(ch==='['){const j=s.indexOf(']',i);if(j<0)throw new Error('bracket');const m=s.slice(i+1,j).match(/^\d*(\*|[A-Z][a-z]?|[a-z]{1,2})/);el=m?m[1]:'*';i=j+1;
      if(el.length===2&&el===el.toLowerCase()&&!['se','as','te'].includes(el))el=el[0];}
    else{const two=s.substr(i,2);if(two==='Cl'||two==='Br'){el=two;i+=2}else if(/[BCNOPSFIbcnops*]/.test(ch)){el=ch;i++}else throw new Error('char '+ch)}
    if(el==='H'){bo=null;continue}
    const ar=el!=='*'&&el===el.toLowerCase();
    atoms.push({el:ar?el[0].toUpperCase()+el.slice(1):el,ar});
    const idx=atoms.length-1;if(prev>=0)bond(prev,idx,bo);bo=null;prev=idx;
  }
  const adj=atoms.map(()=>new Map());bonds.forEach(([a,b,o])=>{adj[a].set(b,o);adj[b].set(a,o)});
  return{atoms,adj};
}
function hasSub(q,t){
  const n=q.atoms.length;if(!n||n>t.atoms.length)return false;
  const order=[],seen=new Set();
  for(let s=0;s<n;s++){if(seen.has(s))continue;const qq=[s];seen.add(s);while(qq.length){const a=qq.shift();order.push(a);for(const b of q.adj[a].keys())if(!seen.has(b)){seen.add(b);qq.push(b)}}}
  const map=new Array(n).fill(-1),used=new Set();let steps=0;
  const bOK=(x,y)=>x===y||((x===1.5||y===1.5)&&x<3&&y<3);
  const aOK=(qa,ta)=>(qa.el==='*'||qa.el===ta.el);
  function rec(k){
    if(k===n)return true;if(++steps>300000)return false;
    const qi=order[k],qa=q.atoms[qi];
    const mappedNb=[...q.adj[qi].keys()].filter(j=>map[j]>=0);
    const cands=mappedNb.length?[...t.adj[map[mappedNb[0]]].keys()]:t.atoms.map((_,i)=>i);
    for(const c of cands){
      if(used.has(c)||!aOK(qa,t.atoms[c])||t.adj[c].size<q.adj[qi].size)continue;
      let ok=true;for(const j of mappedNb){const tb=t.adj[c].get(map[j]);if(tb===undefined||!bOK(q.adj[qi].get(j),tb)){ok=false;break}}
      if(!ok)continue;map[qi]=c;used.add(c);if(rec(k+1))return true;map[qi]=-1;used.delete(c);
    }
    return false;
  }
  return rec(0);
}
const parsedCache=new Map();
const parsed=smi=>{if(!parsedCache.has(smi)){let v=null;try{v=parseSmiles(smi)}catch(e){}parsedCache.set(smi,v)}return parsedCache.get(smi)};
const normF=s=>String(s||'').replace(/[₀-₉]/g,d=>'0123456789'['₀₁₂₃₄₅₆₇₈₉'.indexOf(d)]).replace(/\s/g,'').toLowerCase();
function searchResults(){
  const {q,sub,pid,miss}=ui.s;let qp=null,err='';
  if(sub.trim()){qp=parsed(sub.trim());if(!qp||!qp.atoms.length){err='This SMILES can’t be read. Check brackets and ring numbers.';qp=null}}
  const words=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list=S.compounds.filter(c=>proj(c.projectId));
  if(pid)list=list.filter(c=>c.projectId===pid);
  if(miss)list=list.filter(c=>missing(c).length);
  if(words.length)list=list.filter(c=>{const hay=[c.code,...(c.names||[]),c.smiles,c.notes,c.elnRef].join(' ').toLowerCase(),f=normF(c.formula);return words.every(w=>hay.includes(w)||f.includes(normF(w)))});
  let noSmiles=0;
  if(qp)list=list.filter(c=>{if(!c.smiles){noSmiles++;return false}const t=parsed(c.smiles);return t&&hasSub(qp,t)});
  return{list,err,noSmiles,active:!!(words.length||qp||miss||pid)};
}
function resultsHtml(){
  const r=searchResults();
  const head=`<div class="sec-h"><h3>${r.active?'Results':'All compounds'}</h3><span class="cnt">${r.list.length}</span></div>`;
  return head+(r.err?`<div class="banner">${r.err}</div>`:'')+(r.list.length?`<div class="items">${r.list.sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true})).map(c=>compoundCard(c,true)).join('')}</div>`:`<div class="empty">${S.compounds.length?'No compound matches.':'No compounds yet. Add them from the Characterization tab of a project.'}</div>`)+(r.noSmiles?`<div class="note">${r.noSmiles} compound${r.noSmiles===1?' has':'s have'} no SMILES and can’t be matched by substructure.</div>`:'');
}

function previewDb(){
  const store={},subs={};
  const snap=c=>({docs:Object.entries(store[c]||{}).map(([id,d])=>({id,exists:true,data:()=>d})),metadata:{fromCache:false,hasPendingWrites:false}});
  const emit=c=>(subs[c]||[]).forEach(fn=>fn(snap(c)));
  const P=(c,id,d)=>{(store[c]=store[c]||{})[id]=d};
  const api={
    collection:c=>({add:async d=>{const id=uid();P(c,id,d);emit(c);return{id}},onSnapshot:fn=>{(subs[c]=subs[c]||[]).push(fn);setTimeout(()=>fn(snap(c)),0);return()=>{}}}),
    doc:p=>{const [c,id]=p.split('/');return{update:async d=>{P(c,id,Object.assign({},(store[c]||{})[id],d));emit(c)},set:async d=>{P(c,id,d);emit(c)},delete:async()=>{if(store[c])delete store[c][id];emit(c)}}}

/* ---------- GitHub storage (when the page runs outside claude.ai) ---------- */
const GH_KEY='labOrganizer.github', DATA_FILE='data.json';
let SYNC={err:'',at:0}, setupErr='', ghQueue=Promise.resolve();
function ghCfg(){try{const c=JSON.parse(localStorage.getItem(GH_KEY)||'null');return c&&c.repo&&c.token?c:null}catch(e){return null}}
function ghSave(c){try{c?localStorage.setItem(GH_KEY,JSON.stringify(c)):localStorage.removeItem(GH_KEY)}catch(e){}}
const ghQ=fn=>{const r=ghQueue.then(fn);ghQueue=r.catch(()=>{});return r};
const b64enc=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64dec=t=>{const b=atob(t.replace(/\s/g,''));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const ghH=(c,accept)=>({Authorization:'Bearer '+c.token,Accept:accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const ghUrl=(c,path)=>`https://api.github.com/repos/${c.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
async function ghReq(c,method,path,body,accept){
  const r=await fetch(ghUrl(c,path),{method,cache:'no-store',headers:Object.assign(ghH(c,accept),body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
  if(method==='GET'&&r.status===404)return null;
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}const err=new Error(m||('GitHub error '+r.status));err.status=r.status;throw err}
  return accept&&accept.includes('raw')?r:r.json();
}
const mimeOf=n=>({pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',txt:'text/plain',jdx:'text/plain',dx:'text/plain',csv:'text/csv',json:'application/json'})[(String(n).split('.').pop()||'').toLowerCase()]||'application/octet-stream';
const ghLoading=new Set();
function ghBlob(id,type){
  if(ghLoading.has(id)||!GHC)return;ghLoading.add(id);
  ghReq(GHC,'GET','files/'+id,null,'application/vnd.github.raw+json').then(async r=>{
    if(!r)return;const buf=await r.arrayBuffer();
    LOCAL_BLOBS[id]=URL.createObjectURL(new Blob([buf],{type:type||mimeOf(id)}));render();
  }).catch(e=>{console.warn('file',id,e);ghLoading.delete(id)});
}
function ghErr(e){
  if(e&&e.status===401)return 'GitHub refused the access token (expired or deleted). Go to Settings, disconnect, and connect again with a new token.';
  if(e&&(e.status===403||e.status===404))return 'The token cannot write to the data repository. Check it has “Contents: Read and write” on that repository.';
  return 'Not saved to GitHub yet ('+((e&&e.message)||'no connection')+'). Retrying…';
}
function githubDb(c){
  let store={},sha=null,pending=[],saving=false,timer=null,lastLoad=0;
  const subs={};
  const snap=col=>({docs:Object.entries(store[col]||{}).map(([id,d])=>({id,exists:true,data:()=>d})),metadata:{fromCache:false,hasPendingWrites:pending.length>0}});
  const emit=col=>(col?[col]:Object.keys(subs)).forEach(k=>(subs[k]||[]).forEach(fn=>fn(snap(k))));
  const apply=(st,op)=>{const [k,col,id,d]=op,m=st[col]=st[col]||{};if(k==='set')m[id]=d;else if(k==='upd')m[id]=Object.assign({},m[id],d);else delete m[id]};
  const clone=o=>JSON.parse(JSON.stringify(o));
  async function load(){
    const meta=await ghReq(c,'GET',DATA_FILE);
    if(!meta){store={};sha=null}
    else{sha=meta.sha;let text=meta.encoding==='base64'&&meta.content?new TextDecoder().decode(b64dec(meta.content)):await (await ghReq(c,'GET',DATA_FILE,null,'application/vnd.github.raw+json')).text();
      const data=JSON.parse(text||'{}');store=data.collections||{}}
    pending.forEach(op=>apply(store,op));lastLoad=Date.now();
  }
  async function flush(){
    if(saving||!pending.length)return;saving=true;clearTimeout(timer);
    const n=pending.length,body=JSON.stringify({app:'lab-organizer',version:1,saved:new Date().toISOString(),collections:store});
    try{
      const r=await ghQ(()=>ghReq(c,'PUT',DATA_FILE,Object.assign({message:'Update data',content:b64enc(new TextEncoder().encode(body))},sha?{sha}:{})));
      sha=r.content.sha;pending=pending.slice(n);SYNC={err:'',at:Date.now()};saving=false;emit();
      if(pending.length)schedule(300);
    }catch(e){
      saving=false;console.error(e);
      if(e.status===409||e.status===422){try{await load();emit();return schedule(200)}catch(e2){e=e2}}
      SYNC={err:ghErr(e),at:SYNC.at};render();if(e.status!==401)schedule(15000);
    }
  }
  const schedule=ms=>{clearTimeout(timer);timer=setTimeout(flush,ms)};
  const write=op=>{pending.push(clone(op));apply(store,clone(op));emit(op[1]);schedule(1200)};
  async function reload(force){
    if(pending.length||saving){if(force)await flush();return}
    if(!force&&Date.now()-lastLoad<30000)return;
    try{await load();SYNC.err='';emit()}catch(e){console.warn(e)}
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)reload(false)});
  setInterval(()=>{if(!document.hidden)reload(false)},120000);
  addEventListener('beforeunload',e=>{if(pending.length){flush();e.preventDefault();e.returnValue=''}});
  return{
    _load:load,_reload:reload,
    collection:col=>({add:async d=>{const id=uid()+uid();write(['set',col,id,d]);return{id}},onSnapshot:fn=>{(subs[col]=subs[col]||[]).push(fn);setTimeout(()=>fn(snap(col)),0);return()=>{}}}),
    doc:p=>{const [col,id]=p.split('/');return{update:async d=>write(['upd',col,id,d]),set:async d=>write(['set',col,id,d]),delete:async()=>write(['del',col,id])}}
  };
}
function githubAssets(c){
  return{
    upload:async(f,o)=>{
      if(f.size>20e6){const e=new Error('too large');e.code='too_large';throw e}
      const type=(o&&o.type)||f.type||mimeOf(f.name),id=uid()+'-'+(f.name.replace(/[^\w.\-]+/g,'_').slice(-60)||'file');
      const bytes=new Uint8Array(await f.arrayBuffer());
      await ghQ(()=>ghReq(c,'PUT','files/'+id,{message:'Add '+f.name,content:b64enc(bytes)}));
      LOCAL_BLOBS[id]=URL.createObjectURL(new Blob([bytes],{type}));
      return{id,contentType:type};
    },
    delete:async id=>ghQ(async()=>{const m=await ghReq(c,'GET','files/'+id);if(m&&m.sha)await ghReq(c,'DELETE','files/'+id,{message:'Remove file',sha:m.sha});return{deleted:true}})
  };
}
async function startGithub(){
  try{
    const r=await fetch('https://api.github.com/repos/'+GHC.repo,{headers:ghH(GHC),cache:'no-store'});
    if(r.status===401)throw new Error('GitHub refused this token. Check you copied all of it and that it has not expired.');
    if(r.status===404||r.status===403)throw new Error(`Repository ${GHC.repo} was not found, or this token has no access to it.`);
    if(!r.ok)throw new Error('GitHub answered with error '+r.status+'. Try again.');
    const info=await r.json();
    if(info.private===false)throw new Error(`${GHC.repo} is public. Your data must go in a private repository: make it private on GitHub, or use another one.`);
    const d=githubDb(GHC);await d._load();db=d;assets=githubAssets(GHC);return true;
  }catch(e){console.error(e);setupErr=e.message||String(e);phase='setup';return false}
}
function vSetup(){
  const owner=(location.hostname.match(/^([\w-]+)\.github\.io$/)||[])[1]||'your-name';
  const step=(n,t)=>`<li style="margin:0 0 10px"><b>${n}.</b> ${t}</li>`;
  return `<div class="head"><div><h1>Connect your data</h1><div class="sub">Your projects, tasks and spectra are saved in a private GitHub repository that only you can see. Do this once on each computer or phone you use.</div></div></div>
  ${setupErr?`<div class="banner">${esc(setupErr)}</div>`:''}
  <div class="stack"><section class="sec" style="max-width:720px"><h3>First time only</h3><ol style="padding-left:0;list-style:none;margin:0">
    ${step(1,`Create a <b>private</b> repository for the data, for example <code>${esc(owner)}/lab-organizer-data</code>: <a href="https://github.com/new" target="_blank" rel="noopener">github.com/new</a>.`)}
    ${step(2,`Create a token: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Fine-grained token</a> → Repository access: <i>Only select repositories</i> → the data repository → Permissions: <b>Contents: Read and write</b>. Pick a long expiration, then copy the token.`)}
    ${step(3,'Paste it below. It is stored only in this browser and sent only to GitHub.')}</ol></section>
  <form class="sec" data-form="ghsetup" style="max-width:720px"><h3>Connect</h3>
    <div class="fld"><label for="gh-repo">Data repository</label><input id="gh-repo" type="text" value="${esc(owner)}/lab-organizer-data" autocomplete="off" spellcheck="false"></div>
    <div class="fld"><label for="gh-token">Access token</label><input id="gh-token" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false"></div>
    <div class="row"><button class="btn pri" type="submit">Connect</button></div></form></div>`;
}
const previewAssets={upload:async f=>{const id=uid();LOCAL_BLOBS[id]=URL.createObjectURL(f);return{id,url:LOCAL_BLOBS[id],contentType:f.type}},delete:async()=>({deleted:true})};
const LOCALHOST=/^(file:|http:\/\/(localhost|127\.0\.0\.1))/.test(location.href);
const PREVIEW=!window.claude&&LOCALHOST&&!/[?&]github\b/.test(location.search);
const GH_MODE=!window.claude&&!PREVIEW;
let GHC=GH_MODE?ghCfg():null;

/* ---------- boot ---------- */
render();
const timer=setTimeout(()=>{slow=true;render()},10000);
function subscribe(){
  clearTimeout(timer);phase='loading';
  ALL.forEach(c=>db.collection(c).onSnapshot(snap=>{
    S[c]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(!snap.metadata.fromCache)loaded.add(c);
    if(loaded.size===ALL.length){phase='ready';slow=false;clearTimeout(timer)}
    render();
  },err=>{console.error(c,err);loaded.add(c);if(loaded.size===ALL.length){phase='ready';clearTimeout(timer)}render()}));
}
(async()=>{
  if(PREVIEW){db=previewDb();assets=previewAssets}
  else if(GH_MODE){
    if(!GHC){clearTimeout(timer);phase='setup';return render()}
    if(!await startGithub()){clearTimeout(timer);GHC=null;return render()}
    return subscribe();
  }
  else try{db=window.claude&&await window.claude.use('db')}catch(e){db=null}
  if(!db){clearTimeout(timer);phase='nodb';return render()}
  if(!PREVIEW)window.claude.use('assets').then(a=>{assets=a||null;render()}).catch(()=>{});
  subscribe();
})();
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();render()}},60000);
})();
